<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Streamroom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ff4d5e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="center">
    <div class="card">
      <span class="brand"><span class="dot"></span>Streamroom</span>
      <h1 id="heading">Checking your link…</h1>
      <p class="lead" id="lead"></p>
      <div class="field hidden" id="nameField">
        <label for="name">Your name</label>
        <input id="name" type="text" maxlength="32" autocomplete="nickname">
      </div>
      <p class="hint hidden" id="switchNote"></p>
      <button class="btn primary big hidden" id="go">Sign in</button>
      <div class="error" id="err"></div>
    </div>
  </main>
  <script type="module">
    import { api } from '/common.js';
    const $ = (id) => document.getElementById(id);
    // The token is in the path; this page uses it only when you click (link previews in chat
    // apps fetch pages too, and must not use up one-time links).
    const token = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');

    (async () => {
      try {
        const info = await api(`/api/auth/peek?t=${encodeURIComponent(token)}`);
        if (info.kind === 'admin') {
          $('heading').textContent = info.needsName ? 'Set up your admin account' : `Welcome back, ${info.name}`;
          $('lead').textContent = 'This one-time link signs this device in as the Streamroom admin.';
          $('nameField').classList.toggle('hidden', !info.needsName);
        } else if (info.kind === 'device') {
          $('heading').textContent = `Sign in as ${info.name}`;
          $('lead').textContent = 'This adds this device to your account. The link works once.';
        } else {
          $('heading').textContent = `Hi ${info.name}!`;
          $('lead').textContent = 'You\'ve been invited to Streamroom, a private place to watch and share each other\'s screens. Click below to sign in on this device.';
        }
        if (info.signedInAs && info.signedInAs !== info.name) {
          $('switchNote').textContent = `This device is signed in as ${info.signedInAs}. Continuing switches it to ${info.name || 'the admin account'}.`;
          $('switchNote').classList.remove('hidden');
        }
        $('go').classList.remove('hidden');
      } catch (e) {
        $('heading').textContent = 'This link doesn\'t work';
        $('lead').textContent = e.message;
      }
    })();

    $('go').onclick = async () => {
      $('err').textContent = '';
      $('go').disabled = true;
      try {
        await api('/api/auth/redeem', { token, name: $('name').value });
        // Drop the token from history so Back doesn't land on a used link.
        location.replace('/');
      } catch (e) {
        $('err').textContent = e.message;
        $('go').disabled = false;
      }
    };
    $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
  </script>
</body>
</html>
