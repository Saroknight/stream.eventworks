<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · Streamroom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ff4d5e%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="page">
    <header class="pagebar">
      <a class="brand" href="/"><span class="dot"></span>Streamroom</a>
      <span class="crumb">Admin</span>
      <span class="spacer"></span>
      <span id="account"></span>
    </header>
    <main class="wrap admin">
      <div class="error" id="err"></div>

      <section class="panel" id="healthPanel">
        <h2>Health <span class="hint" id="healthSummary"></span></h2>
        <div class="health-grid" id="healthGrid"><p class="hint">Checking…</p></div>
        <details class="health-events" id="healthEventsBox">
          <summary>Connection problems <span class="hint" id="healthEventsCount"></span></summary>
          <div id="healthEvents"></div>
        </details>
      </section>

      <section class="panel">
        <h2>Invite someone</h2>
        <form class="start" id="inviteForm">
          <input id="inviteName" type="text" maxlength="32" placeholder="Their name, as others will see it" autocomplete="off" aria-label="Name">
          <button class="btn primary" type="submit">Create invite</button>
        </form>
        <div class="newlink hidden" id="newLink">
          <p><b id="newLinkFor"></b></p>
          <div class="linkbox"><input type="text" readonly id="newLinkUrl"><button class="btn" id="newLinkCopy">Copy</button></div>
          <p class="hint" id="newLinkNote"></p>
        </div>
      </section>

      <section class="panel">
        <h2>Live rooms <span class="hint" id="roomsCount"></span></h2>
        <div id="rooms"></div>
      </section>

      <section class="panel">
        <h2>People <span class="hint" id="peopleCount"></span></h2>
        <table class="list" id="people"></table>
      </section>

      <section class="panel hidden" id="pendingPanel">
        <h2>Invites not used yet</h2>
        <table class="list" id="pending"></table>
      </section>
    </main>
  </div>

  <script type="module">
    import { accountMenu, ago, api, confirmButton, copy, h, me, toast } from '/common.js';
    const $ = (id) => document.getElementById(id);
    const until = (ms) => { const d = Math.ceil((ms - Date.now()) / 864e5); return d <= 0 ? 'expired' : `expires in ${d} day${d > 1 ? 's' : ''}`; };

    function showLink(title, url, note) {
      $('newLinkFor').textContent = title;
      $('newLinkUrl').value = url;
      $('newLinkNote').textContent = note;
      $('newLink').classList.remove('hidden');
      $('newLink').scrollIntoView({ behavior: 'smooth', block: 'center' });
      copy(url, 'Link copied');
    }
    $('newLinkCopy').onclick = () => copy($('newLinkUrl').value);

    const act = (fn) => async () => {
      try { await fn(); await refresh(); } catch (e) { toast(e.message); }
    };

    function personRow(p, myId) {
      const nameCell = h('td', {}, h('b', {}, p.name), p.isAdmin ? h('span.badge', {}, 'admin') : null,
        p.id === myId ? h('span.hint', {}, ' (you)') : null);
      const devices = p.devices.length
        ? p.devices.map((d) => h('div.hint', {}, `${d.device} · ${ago(d.lastSeen)}`))
        : [h('div.hint', {}, 'No signed-in devices')];
      const rename = h('button.btn.sm.ghost', {
        onclick: () => {
          const input = h('input', { type: 'text', value: p.name, maxlength: 32 });
          const save = h('button.btn.sm', {
            onclick: act(async () => { await api(`/api/admin/users/${p.id}/rename`, { name: input.value }); }),
          }, 'Save');
          nameCell.replaceChildren(h('div.inline', {}, input, save));
          input.focus();
          input.onkeydown = (e) => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') refresh(); };
        },
      }, 'Rename');
      const link = h('button.btn.sm.ghost', {
        onclick: act(async () => {
          const r = await api(`/api/admin/users/${p.id}/link`, {});
          showLink(`New sign-in link for ${p.name}`, r.url, `Signs in ${p.name} on any device for 7 days. Their old link stops working.`);
        }),
      }, 'New sign-in link');
      const actions = h('td.actions', {}, rename, link);
      if (!p.isAdmin) {
        const remove = h('button.btn.sm.danger', {}, 'Remove');
        confirmButton(remove, `Remove ${p.name}?`, act(async () => { await api(`/api/admin/users/${p.id}/revoke`, {}); toast(`${p.name} removed`); }));
        actions.append(remove);
      }
      return h('tr', {}, nameCell, h('td', {}, devices), h('td.hint', {}, p.lastSeen ? `seen ${ago(p.lastSeen)}` : ''), actions);
    }

    function pendingRow(i) {
      const cancel = h('button.btn.sm.danger', {}, 'Cancel');
      confirmButton(cancel, 'Cancel invite?', act(async () => { await api(`/api/admin/invites/${i.id}/cancel`, {}); }));
      return h('tr', {},
        h('td', {}, h('b', {}, i.name)),
        h('td.hint', {}, `created ${ago(i.createdAt)} · ${until(i.expiresAt)}`),
        h('td.actions', {},
          h('button.btn.sm.ghost', {
            onclick: act(async () => {
              const r = await api(`/api/admin/invites/${i.id}/renew`, {});
              showLink(`New invite link for ${i.name}`, r.url, 'Valid for 7 days on any number of devices. The old link stops working.');
            }),
          }, 'New link'),
          cancel));
    }

    function roomCard(r) {
      const end = h('button.btn.sm.danger', {}, 'End room');
      confirmButton(end, 'End for everyone?', act(async () => { await api(`/api/admin/rooms/${encodeURIComponent(r.id)}/end`, {}); toast('Room ended'); }));
      const people = r.people.length ? r.people.map((p) => {
        const remove = h('button.btn.sm.ghost', {}, 'Remove');
        confirmButton(remove, 'Sure?', act(async () => {
          await api(`/api/admin/rooms/${encodeURIComponent(r.id)}/remove`, { identity: p.identity });
        }));
        return h('div.person', {},
          p.live ? h('span.live-badge', {}, 'LIVE') : h('span.dot-idle', {}),
          h('span', {}, p.name), h('span.hint', {}, p.kind === 'app' ? 'app' : 'browser'), remove);
      }) : [h('p.hint', {}, 'Empty. Ends on its own after 5 minutes.')];
      return h('div.admin-room', {},
        h('div.room-top', {}, h('div', {}, h('b', {}, r.title), h('div.hint', {}, `started by ${r.creator.name} · ${ago(r.createdAt)}`)),
          h('div.inline', {}, h('a.btn.sm', { href: `/r/${encodeURIComponent(r.id)}` }, 'Open'), end)),
        h('div.people', {}, people));
    }

    async function refresh() {
      try {
        const s = await api('/api/admin/state');
        $('people').replaceChildren(...s.people.map((p) => personRow(p, s.me)));
        $('peopleCount').textContent = `· ${s.people.length}`;
        $('pending').replaceChildren(...s.pending.map(pendingRow));
        $('pendingPanel').classList.toggle('hidden', !s.pending.length);
        $('rooms').replaceChildren(...(s.rooms.length ? s.rooms.map(roomCard)
          : [h('p.hint', {}, s.roomsError || 'Nothing live right now.')]));
        $('roomsCount').textContent = s.rooms.length ? `· ${s.rooms.length}` : '';
        $('err').textContent = '';
      } catch (e) {
        if (e.status === 401 || e.status === 403) { location.href = '/'; return; }
        $('err').textContent = e.message;
      }
    }

    // ---------- health ----------
    const fmtDur = (sec) => { const d = Math.floor(sec / 86400); const h = Math.floor((sec % 86400) / 3600); const m = Math.floor((sec % 3600) / 60);
      return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
    const gb = (b) => `${(b / 1073741824).toFixed(1)} GB`;
    const chip = (status, title, lines) => h(`div.health-card.${status}`, {},
      h('div.health-title', {}, h('span.health-dot', {}), title), ...lines.map((l) => h('div.hint', {}, l)));

    async function refreshHealth() {
      let hs;
      try { hs = await api('/api/admin/health'); } catch (e) { $('healthGrid').replaceChildren(h('p.error', {}, e.message)); return; }
      const sv = hs.server;
      const loadPct = Math.round((sv.load[0] / sv.cpus) * 100);
      const memPct = Math.round((sv.memUsed / sv.memTotal) * 100);
      const serverStatus = loadPct > 90 || memPct > 90 ? 'bad' : loadPct > 60 || memPct > 80 ? 'warn' : 'ok';
      const v = hs.video;
      $('healthGrid').replaceChildren(
        chip(serverStatus, 'Server', [`CPU ${loadPct}% · memory ${memPct}% of ${gb(sv.memTotal)}`, `Up ${fmtDur(sv.uptime)} · site restarted ${fmtDur(sv.appUptime)} ago`]),
        v.status === 'ok'
          ? chip(v.ms > 1500 ? 'warn' : 'ok', 'Video server', [`Answering in ${v.ms} ms`, `${v.rooms} room${v.rooms === 1 ? '' : 's'} · ${v.people} connected · ${v.live} live`])
          : chip('bad', 'Video server', ['Not answering', v.error || '']),
        chip(hs.media.status === 'skip' ? 'ok' : hs.media.status, 'Video address', [hs.media.text]),
        chip(hs.failures24h ? 'warn' : 'ok', 'Connection problems', [hs.failures24h ? `${hs.failures24h} in the last 24 hours (details below)` : 'None in the last 24 hours']),
      );
      const bad = [serverStatus, v.status === 'ok' ? 'ok' : 'bad', hs.media.status].filter((x) => x === 'bad').length;
      $('healthSummary').textContent = bad ? '· needs attention' : '· all good';
      $('healthEventsCount').textContent = hs.events.length ? `· ${hs.events.length}` : '· none';
      const clear = h('button.btn.sm.ghost', {}, 'Clear list');
      confirmButton(clear, 'Clear?', async () => { await api('/api/admin/health/clear', {}); refreshHealth(); });
      $('healthEvents').replaceChildren(...(hs.events.length ? [
        h('table.list', {}, ...hs.events.map((e) => h('tr', {},
          h('td', {}, h('b', {}, e.userName || 'someone'), h('div.hint', {}, ago(e.at))),
          h('td', {}, h('div', {}, e.explain), h('div.hint', {}, [e.browser, e.ip, e.room ? `room ${e.room}` : '', e.detail?.attempts > 1 ? `tried ${e.detail.attempts} times` : ''].filter(Boolean).join(' · ')),
            e.message ? h('div.hint.mono', {}, e.message) : null)))),
        h('div.inline', {}, clear),
      ] : [h('p.hint', {}, 'Nobody has had trouble connecting.')]));
    }

    $('inviteForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const r = await api('/api/admin/invites', { name: $('inviteName').value });
        $('inviteName').value = '';
        showLink(`Invite for ${r.name}`, r.url, 'Send this to them. It works on all their devices for 7 days, then expires.');
        await refresh();
      } catch (err) { toast(err.message); }
    };

    (async () => {
      const user = await me().catch(() => null);
      if (!user?.isAdmin) { location.href = '/'; return; }
      $('account').replaceWith(accountMenu(user));
      await refresh();
      refreshHealth();
      setInterval(() => { if (!document.hidden) refreshHealth(); }, 15000);
      // Keep it fresh, but never while you're typing (e.g. renaming someone).
      setInterval(() => {
        const typing = document.activeElement?.tagName === 'INPUT' && document.activeElement !== $('newLinkUrl');
        if (!document.hidden && !typing) refresh();
      }, 5000);
    })();
  </script>
</body>
</html>
