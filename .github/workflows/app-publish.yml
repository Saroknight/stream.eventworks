name: Publish app build

# Called by app.yml once a platform's build is done. Adds that platform's files to release
# app-v<version> (creating it if this platform finished first) and merges SHA256SUMS.

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # One at a time, so the two platforms never race on creating the release or SHA256SUMS.
    concurrency:
      group: app-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          TAG="app-v$VER"
          cd dist
          FILES=$(ls)
          sha256sum $FILES > mine.sums
          cat mine.sums
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            have=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name')
            first=$(echo "$FILES" | head -1)
            if echo "$have" | grep -qx "$first"; then echo "$TAG already has $first"; exit 0; fi
            gh release download "$TAG" --repo "$REPO" -p SHA256SUMS -O old.sums || touch old.sums
            for f in $FILES; do sed -i "/  $f\$/d" old.sums; done
            cat old.sums mine.sums > SHA256SUMS
            gh release upload "$TAG" --repo "$REPO" --clobber $FILES SHA256SUMS
          else
            cp mine.sums SHA256SUMS
            cat > ../notes.md <<NOTES
          **Windows:** download **Streamroom-Live-Setup.exe** below and run it. Windows may say it protected your PC: click **More info**, then **Run anyway**. (If it isn't listed yet, it's still building: check back in a few minutes.)

          **Arch Linux / CachyOS:**
          \`\`\`
          curl -LO https://github.com/$REPO/releases/latest/download/streamroom-live-x86_64.pkg.tar.zst && sudo pacman -U streamroom-live-x86_64.pkg.tar.zst
          \`\`\`

          Installed copies update themselves.
          NOTES
            gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" $FILES SHA256SUMS \
              --title "Streamroom Live $VER" --latest --notes-file ../notes.md
          fi
