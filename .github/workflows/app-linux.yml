name: "Client app: Linux build"
run-name: "Linux build · ${{ github.ref_name }} · ${{ github.event_name == 'workflow_dispatch' && 'manual run' || github.event.head_commit.message }}"

# Builds the Arch Linux pacman package when Linux or shared app code changes (Windows-only
# changes don't start it). To release: bump app/release/linux and push to main; it's published
# as GitHub Release linux-v<version>, which the site's download command and the Linux updater use.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "!app/wincap/src/audio.rs"
      - "!app/wincap/src/capture.rs"
      - "!app/wincap/src/convert.rs"
      - "!app/wincap/src/cursor.rs"
      - "!app/wincap/src/d3d.rs"
      - "!app/wincap/src/encoder.rs"
      - "!app/wincap/src/pipeline.rs"
      - "!app/desktop/src/account.rs"
      - "!app/desktop/icons/icon.ico"
      - "!app/release/windows"
      - "!app/README.md"
      - ".github/workflows/app-linux.yml"
  workflow_dispatch:

concurrency:
  group: app-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    # Built on Arch itself, against Arch's libraries (CachyOS, EndeavourOS... use the same).
    container: archlinux:base-devel
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      # Link with mold (much faster than the default linker on the big app binary). Set here
      # rather than in app/.cargo/config.toml so local builds don't need mold installed.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Build tools and libraries
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rustup clang mold pkgconf openssl \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg \
            gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly \
            gst-plugin-pipewire gst-plugin-va pipewire xdg-desktop-portal
          # Pinned: the Rust cache is per compiler version, so following "stable" meant a full
          # cold build (~16 min) every six weeks. Bump this on purpose.
          rustup default 1.99.1

      - uses: actions/checkout@v4

      - name: Version
        id: ver
        working-directory: app
        run: |
          VER=$(tr -d '[:space:]' < release/linux)
          sed -i "0,/^version = .*/s//version = \"$VER\"/" Cargo.toml
          echo "version=$VER" >> "$GITHUB_OUTPUT"; echo "Linux $VER"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Unit tests
        working-directory: app
        # --release: reuses the release build's dependencies instead of compiling them all a
        # second time in debug (most of a cold build), and keeps the cache about half the size.
        run: cargo test --release -p streamroom-core -p streamroom-desktop -p wincap

      - name: Build app
        working-directory: app/desktop
        run: npx --yes @tauri-apps/cli@2 build --no-bundle --ci

      - name: Build command-line tool
        working-directory: app
        run: cargo build --release -p streamroom-cli --features testsrc

      - name: Package (pacman)
        working-directory: app
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          BIN=$(ls target/release/streamroom-live "target/release/Streamroom Live" 2>/dev/null | head -1)
          test -n "$BIN" || { ls target/release; exit 1; }
          mkdir -p /tmp/pkg dist
          cp "$BIN" /tmp/pkg/streamroom-live
          cp target/release/streamroom-live-cli /tmp/pkg/
          cp packaging/arch/PKGBUILD packaging/arch/streamroom-live.desktop /tmp/pkg/
          cp desktop/icons/128x128.png /tmp/pkg/streamroom-live.png
          sed -i "s/^pkgver=.*/pkgver=$VER/" /tmp/pkg/PKGBUILD
          useradd -m builder && chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && PKGEXT=.pkg.tar.zst makepkg -f --nodeps"
          cp /tmp/pkg/streamroom-live-$VER-1-x86_64.pkg.tar.zst dist/streamroom-live-x86_64.pkg.tar.zst
          pacman -Qip dist/streamroom-live-x86_64.pkg.tar.zst
          pacman -Qlp dist/streamroom-live-x86_64.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: streamroom-live-linux
          path: app/dist/
          retention-days: 30

  publish:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: streamroom-live-linux
          path: dist

      - name: Publish (if this version isn't released yet)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: linux-v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          URL="https://github.com/$REPO/releases/download/$TAG/streamroom-live-x86_64.pkg.tar.zst"
          printf '%s\n' "For Arch Linux and CachyOS. Install or update by hand:" '```' \
            "curl -LO $URL && sudo pacman -U streamroom-live-x86_64.pkg.tar.zst" '```' "" \
            "Installed copies update themselves." > ../notes.md
          # Not marked latest: "latest" stays the Windows release, which the site and older
          # Windows apps look at.
          gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" * \
            --title "Streamroom Live ${TAG#linux-v} for Linux" --latest=false --notes-file ../notes.md
