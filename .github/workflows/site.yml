name: "Website: E2E tests"
run-name: "E2E tests · ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event_name == 'workflow_dispatch' && format('{0} · manual run (with relay test)', github.ref_name) || format('{0} · {1}', github.ref_name, github.event.head_commit.message) }}"

# On every push: start LiveKit and the site on a fresh machine and drive real browsers through
# sign-in, invites, rooms, streaming and the app hand-off (tests/e2e.mjs).

on:
  push:
    paths-ignore:
      - "app/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E (sign-in, rooms, streaming)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          curl -sSL https://get.livekit.io | bash
          livekit-server --version

      - name: End-to-end test
        run: npm run test:e2e

      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-test-results
          path: test-results/
          retention-days: 14

  # The real installer on a fresh Ubuntu machine, then video with the normal video ports
  # blocked for the browser: it can only arrive through the port 443 relay.
  # The relay is optional and parked, so this runs only when started by hand (Actions tab ->
  # Website: E2E tests -> Run workflow).
  relay:
    name: Relay E2E (installer, port 443 relay)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test names for the site and the relay
        run: |
          IP=$(hostname -I | awk '{print $1}')
          echo "IP=$IP" >> "$GITHUB_ENV"
          echo "$IP stream.test turn.stream.test" | sudo tee -a /etc/hosts
          getent ahostsv4 turn.stream.test

      - name: Install with setup.sh (local test certificates)
        run: sudo RELAY_443=on CADDY_GLOBAL_EXTRA=local_certs bash deploy/linux/setup.sh stream.test "$IP"

      - name: Installed state
        run: |
          sudo cat /etc/caddy/Caddyfile
          sudo cat /etc/livekit/livekit.yaml | grep -v -i secret
          systemctl is-active caddy livekit streamroom
          grep -q '^turn:' /etc/livekit/livekit.yaml || sudo grep -q '^turn:' /etc/livekit/livekit.yaml

      - name: Detailed relay logging (test only)
        run: |
          sudo sed -i 's/^  level: info/  level: info\n  pion_level: debug/' /etc/livekit/livekit.yaml
          sudo systemctl restart livekit
          sleep 2

      - name: Trust the local test certificate authority in Chromium
        run: |
          sudo apt-get install -y -q libnss3-tools
          for _ in $(seq 1 30); do sudo test -f /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt && break; sleep 1; done
          sudo cp /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt /tmp/caddy-root.crt
          sudo chmod 644 /tmp/caddy-root.crt
          mkdir -p ~/.pki/nssdb
          certutil -d sql:$HOME/.pki/nssdb -N --empty-password 2>/dev/null || true
          certutil -d sql:$HOME/.pki/nssdb -A -t "C,," -n caddy-local -i /tmp/caddy-root.crt
          for _ in $(seq 1 30); do curl -sf --cacert /tmp/caddy-root.crt https://stream.test/api/app/latest && break; sleep 2; done

      - name: Block the browser from the normal video ports
        run: |
          # Only this user's traffic (the browser), so LiveKit's own relay leg still works.
          for rule in "-p udp --dport 7882" "-p tcp --dport 7881" "-p udp --dport 3478"; do
            sudo iptables -I OUTPUT $rule -m owner --uid-owner "$(id -u)" -j REJECT
          done
          sudo iptables -L OUTPUT -n

      - name: Video through the port 443 relay
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          ADMIN=$(sudo /usr/local/bin/streamroom-admin-link https://stream.test | grep -o 'https://stream.test/join/[^ ]*')
          node tests/relay.mjs https://stream.test "$ADMIN"

      - name: Relay diagnostics
        if: always()
        run: |
          echo "== TLS on 443 for the relay name"
          echo | openssl s_client -connect turn.stream.test:443 -servername turn.stream.test -CAfile /tmp/caddy-root.crt 2>&1 | grep -E "subject=|issuer=|Verify return|alert|error" || true
          echo "== TLS on 443 for the site"
          echo | openssl s_client -connect stream.test:443 -servername stream.test -CAfile /tmp/caddy-root.crt 2>&1 | grep -E "subject=|Verify return" || true
          echo "== listening"
          sudo ss -ltnup | grep -E ":443|:5349|:3478|:7881|:7882|:8443" || true
          echo "== livekit (turn / ice)"
          J=$(sudo journalctl -u livekit --no-pager)
          for k in "Received AllocateRequest" "Received CreatePermission" "Adding permission" "No Permission or Channel" "ChannelBind" "Exit read loop" "Failed" "denied" "Forbidden"; do
            printf '%-28s %s\n' "$k" "$(echo "$J" | grep -c "$k")"
          done
          echo "$J" | grep -iE "CreatePermission|Adding permission|denied|forbidden|failed to|error" | grep -v twirp | cut -c1-400 | tail -25
          echo "== livekit failures"
          sudo journalctl -u livekit --no-pager | grep -E "without connection" | grep -o '"publisherCandidates".\{0,700\}' | tail -2 || true
          echo "== caddy (layer4 / tls / errors)"
          sudo journalctl -u caddy --no-pager | grep -iE "layer4|error|handshake|proxy|warn" | grep -v "tls.obtain\|cache.maintenance\|storage" | cut -c1-400 | tail -30 || true

      - name: Server logs
        if: always()
        run: |
          mkdir -p test-results
          sudo journalctl -u caddy -u livekit -u streamroom --no-pager | tail -400 > test-results/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-test-results
          path: test-results/
          retention-days: 14
