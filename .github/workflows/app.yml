name: Windows and Linux app

# Every push that touches the app builds it for Windows (installer) and Arch Linux (pacman
# package); download them from the run's artifacts. On main, if app/Cargo.toml has a version
# with no release yet, both are published as GitHub Release app-v<version>: that's what the
# site's /download page and the app's auto-updater use. So to release: bump the version and
# push to main. Each platform is published as soon as its build finishes (app-publish.yml).

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Unit tests
        run: cargo test -p streamroom-core -p streamroom-desktop

      - name: Build installer
        working-directory: app/desktop
        run: npx --yes @tauri-apps/cli@2 build --ci

      - name: Build command-line tool
        run: cargo build --release -p streamroom-cli --features testsrc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          Copy-Item $setup.FullName dist/Streamroom-Live-Setup.exe
          Copy-Item target/release/streamroom-live-cli.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: streamroom-live-windows
          path: app/dist/
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    # Built on Arch itself, against Arch's libraries (CachyOS, EndeavourOS... use the same).
    container: archlinux:base-devel
    steps:
      - name: Build tools and libraries
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm rustup clang pkgconf openssl \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg \
            gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly \
            gst-plugin-pipewire gst-plugin-va pipewire xdg-desktop-portal
          rustup default stable

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Unit tests
        working-directory: app
        run: cargo test -p streamroom-core -p streamroom-desktop -p wincap

      - name: Build app
        working-directory: app/desktop
        run: npx --yes @tauri-apps/cli@2 build --no-bundle --ci

      - name: Build command-line tool
        working-directory: app
        run: cargo build --release -p streamroom-cli --features testsrc

      - name: Package (pacman)
        working-directory: app
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          BIN=$(ls target/release/streamroom-live "target/release/Streamroom Live" 2>/dev/null | head -1)
          test -n "$BIN" || { ls target/release; exit 1; }
          mkdir -p /tmp/pkg dist
          cp "$BIN" /tmp/pkg/streamroom-live
          cp target/release/streamroom-live-cli /tmp/pkg/
          cp packaging/arch/PKGBUILD packaging/arch/streamroom-live.desktop /tmp/pkg/
          cp desktop/icons/128x128.png /tmp/pkg/streamroom-live.png
          sed -i "s/^pkgver=.*/pkgver=$VER/" /tmp/pkg/PKGBUILD
          useradd -m builder && chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && PKGEXT=.pkg.tar.zst makepkg -f --nodeps"
          cp /tmp/pkg/streamroom-live-$VER-1-x86_64.pkg.tar.zst dist/streamroom-live-x86_64.pkg.tar.zst
          pacman -Qip dist/streamroom-live-x86_64.pkg.tar.zst
          pacman -Qlp dist/streamroom-live-x86_64.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: streamroom-live-linux
          path: app/dist/
          retention-days: 30

  # Each platform is published as soon as it's built (Linux is much quicker), into the same
  # release app-v<version>; SHA256SUMS is merged so both updaters can verify their file.
  publish-linux:
    needs: linux
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/app-publish.yml
    with:
      artifact: streamroom-live-linux
    permissions:
      contents: write

  publish-windows:
    needs: windows
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/app-publish.yml
    with:
      artifact: streamroom-live-windows
    permissions:
      contents: write
