name: Windows app

# Every push that touches the app builds the installer (download it from the run's artifacts).
# On main, if app/Cargo.toml has a version with no release yet, the build is published as
# GitHub Release app-v<version>: that's what the site's /download page and the app's
# auto-updater use. So to release: bump the version and push to main.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Should this build be released?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $publish = 'false'
          if ("${{ github.ref }}" -eq 'refs/heads/main') {
            gh release view "app-v$ver" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $publish = 'true' }
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "version $ver, publish: $publish"
          $global:LASTEXITCODE = 0

      - name: Unit tests
        run: cargo test -p streamroom-core -p streamroom-desktop

      - name: Build installer
        working-directory: app/desktop
        run: npx --yes @tauri-apps/cli@2 build --ci

      - name: Build command-line tool
        run: cargo build --release -p streamroom-cli --features testsrc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          Copy-Item $setup.FullName dist/Streamroom-Live-Setup.exe
          Copy-Item target/release/streamroom-live-cli.exe dist/
          Push-Location dist
          Get-ChildItem -File | Where-Object Name -ne SHA256SUMS | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: streamroom-live-windows
          path: app/dist/
          retention-days: 30

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.rel.outputs.version }}"
          gh release create "app-v$ver" --target "${{ github.sha }}" dist/Streamroom-Live-Setup.exe dist/SHA256SUMS dist/streamroom-live-cli.exe `
            --title "Streamroom Live $ver" `
            --notes "Download **Streamroom-Live-Setup.exe** below and run it. Windows may say it protected your PC: click **More info**, then **Run anyway**. Installed copies update themselves." `
            --latest
