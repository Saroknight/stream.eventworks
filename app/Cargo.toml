[package]
name = "streamroom-live"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
