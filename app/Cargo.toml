[workspace]
resolver = "2"
members = ["core", "wincap", "cli", "desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 4
