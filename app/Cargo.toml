[workspace]
resolver = "2"
members = ["core", "wincap", "cli", "desktop"]

[workspace.package]
version = "0.4.2"
edition = "2021"

# Each member opts in with `[lints] workspace = true`. Tests may unwrap (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1"
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 4
