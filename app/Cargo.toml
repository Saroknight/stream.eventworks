[package]
name = "streamroom-live"
version = "0.1.0"
edition = "2021"
description = "Native screen streaming for Streamroom: hardware capture and encoding, published to LiveKit"

[workspace]
members = [".", "wincap"]

[features]
# Software test-pattern source (OpenH264). For testing the publishing path without a GPU.
testsrc = ["dep:openh264"]

[dependencies]
anyhow = "1"
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
wincap = { path = "wincap" }
openh264 = { version = "0.9", optional = true }

[profile.release]
lto = "thin"
codegen-units = 4
