[package]
name = "wincap"
version.workspace = true
edition.workspace = true
description = "Windows screen capture (DXGI Desktop Duplication), GPU color conversion and Media Foundation hardware H.264 encoding"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_UI_HiDpi",
]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

# Linux: screen via the desktop's screen-share portal (Wayland) or X11, encoded by GStreamer
# (VA-API on AMD/Intel, NVENC on NVIDIA, x264 as a fallback); sound via PipeWire.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
